[package]
name = "appify"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["image-png", "tray-icon", "devtools"] }
tauri-plugin-opener = "2.0.0"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
ureq = "2.9"
scraper = "0.19"
dirs = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_36"] }
gtk = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
glib = "0.18"
javascriptcore-rs = "1.1"

[profile.dev]
opt-level = 0
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.test]
opt-level = 1
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
